name: Galaxy tool (lint + test + release)

on:
  push:
    # Branch pushes run only when Galaxy files change; path filters are not
    # applied to tag pushes, so every v* tag runs lint + test + release.
    # The release version comes from the tag (see .github/scripts/galaxy_version_from_tag.sh).
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'galaxy/**'
      - '.github/workflows/galaxy-tool.yml'
      - '.github/scripts/galaxy_version_from_tag.sh'
  pull_request:
    paths:
      - 'galaxy/**'
      - '.github/workflows/galaxy-tool.yml'
      - '.github/scripts/galaxy_version_from_tag.sh'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: planemo lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install planemo
        run: pip install planemo
      - name: Set wrapper version from release tag
        run: bash .github/scripts/galaxy_version_from_tag.sh
      - name: Lint tool
        run: planemo lint galaxy/map/map.xml

  test:
    name: planemo test (Docker container)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install planemo
        run: pip install planemo

      # ubuntu-latest ships with Docker; confirm the daemon is reachable.
      - name: Check Docker
        run: docker version

      - name: Set wrapper version from release tag
        run: bash .github/scripts/galaxy_version_from_tag.sh

      - name: Test tool inside its container
        # --docker makes Galaxy's ExplicitDockerContainerResolver run the job in the
        # image declared by <container type="docker"> in macros.xml.
        run: >
          planemo test
          --docker
          --galaxy_python_version 3.11
          --test_output test_report.html
          --test_output_json test_report.json
          galaxy/map/map.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planemo-test-report
          path: |
            test_report.html
            test_report.json
          if-no-files-found: ignore

  release:
    name: Release to Galaxy Tool Shed
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vX.Y.Z publishes MAP X.Y.Z; vX.Y.Z+galaxyN publishes a wrapper-only update.
      # Stops if the ghcr.io/cbg-innov/map:X.Y.Z image hasn't been pushed yet.
      - name: Set wrapper version from release tag
        run: bash .github/scripts/galaxy_version_from_tag.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install planemo
        run: pip install planemo

      # Only the API key is needed: planemo reads it from the environment, and the
      # Tool Shed derives the account (which must equal `owner` in .shed.yml) from it.
      - name: Update Tool Shed
        env:
          TOOLSHED_API_KEY: ${{ secrets.TOOLSHED_API_KEY }}
        run: >
          planemo shed_update
          --shed_target toolshed
          --shed_key_from_env TOOLSHED_API_KEY
          --force_repository_creation
          --check_diff
          galaxy/map
